services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tokenburn}
      POSTGRES_USER: ${POSTGRES_USER:-tokenburn}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: node:22-alpine
    container_name: token-burn-dev-web
    working_dir: /app
    command: >
      sh -lc "corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @token-burn/web db:generate &&
      pnpm --filter @token-burn/web db:deploy &&
      pnpm --filter @token-burn/web exec next dev --hostname 0.0.0.0 --port 3000"
    environment:
      ADMIN_GITHUB_LOGIN: ${ADMIN_GITHUB_LOGIN:-octocat}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-github-client-id}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-github-client-secret}
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret}
      AUTH_URL: ${AUTH_URL:-https://tokenburn-dev.nayanbhut.dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql://tokenburn:change-this-password@postgres:5432/tokenburn}
      TOKEN_BURN_PUBLIC_URL: ${TOKEN_BURN_PUBLIC_URL:-https://tokenburn-dev.nayanbhut.dev}
      CI: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
      - root-node-modules:/app/node_modules
      - web-node-modules:/app/apps/web/node_modules
      - shared-node-modules:/app/packages/shared/node_modules
      - cli-node-modules:/app/packages/cli/node_modules
      - pnpm-store:/root/.local/share/pnpm/store
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - proxy

volumes:
  root-node-modules:
  web-node-modules:
  shared-node-modules:
  cli-node-modules:
  postgres-dev-data:
  pnpm-store:

networks:
  proxy:
    external: true
    name: proxy
