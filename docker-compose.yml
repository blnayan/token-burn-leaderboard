services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      TZ: UTC
      HOSTNAME: 0.0.0.0
      ADMIN_GITHUB_LOGIN: ${ADMIN_GITHUB_LOGIN}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL}
      DATABASE_URL: ${DATABASE_URL}
      TOKEN_BURN_PUBLIC_URL: ${TOKEN_BURN_PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
      proxy:
        aliases:
          - token-burn-web
    ports:
      - "127.0.0.1:3000:3000"

  migrate:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: migrator
    profiles:
      - tools
    environment:
      TZ: UTC
      DATABASE_URL: ${DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  proxy:
    external: true
    name: proxy
